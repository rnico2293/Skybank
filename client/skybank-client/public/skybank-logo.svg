<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" role="img" aria-labelledby="skybankLogoTitle">
  <title id="skybankLogoTitle">SkyBank</title>

  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ecbf5" />
      <stop offset="100%" stop-color="#2e7bd6" />
    </linearGradient>

    <linearGradient id="horizonGradient" gradientUnits="userSpaceOnUse" x1="4" y1="88" x2="296" y2="88">
      <stop offset="0%" stop-color="#2e7bd6" stop-opacity="0" />
      <stop offset="50%" stop-color="#2e7bd6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2e7bd6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- sun peeking behind the cloud -->
  <circle cx="63" cy="24" r="9" fill="#fff6d8" opacity="0.9" />

  <!-- cloud mark -->
  <g>
    <rect x="16" y="34" width="46" height="24" rx="12" fill="url(#cloudGradient)" />
    <circle cx="26" cy="32" r="13" fill="url(#cloudGradient)" />
    <circle cx="42" cy="25" r="17" fill="url(#cloudGradient)" />
    <circle cx="58" cy="33" r="12" fill="url(#cloudGradient)" />
  </g>

  <!-- wordmark -->
  <text x="92" y="53" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700">
    <tspan fill="#0b4f96">Sky</tspan><tspan fill="#5bb3ec">Bank</tspan>
  </text>

  <!-- horizon line the logo rests on -->
  <line x1="4" y1="88" x2="296" y2="88" stroke="url(#horizonGradient)" stroke-width="3" stroke-linecap="round" />
</svg>
