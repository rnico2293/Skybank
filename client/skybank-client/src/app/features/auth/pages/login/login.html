<div class="min-h-screen flex items-center justify-center bg-[#B9D8F3]">

  <div class="w-full max-w-md flex flex-col gap-6 text-center">

    <h1 class="text-4xl font-bold text-blue-500"  >
      SKY BANK 
    </h1>



    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-4"
    >
    
      <div class="flex flex-col gap-1">
          <label for="username">Email</label>

          <input
          id="email"
          type="email"
          formControlName="email"
          class = "py-1 mt-1 border-2 rounded 
          border-grey-200 focus:outline-none 
          focus:ring-2 focus:ring-blue-500 
          hover:ring-2 hover:ring-yellow-500">
      </div>
        
      <div class="flex flex-col gap-1">
          <label for="password">Password</label>
          
          <input
          id="password"
          type="password"
          formControlName="password"
          class = "py-1 mt-1 border-2 rounded 
          border-grey-200 focus:outline-none 
          focus:ring-2 focus:ring-blue-500 
          hover:ring-2 hover:ring-yellow-500">
      </div>
        
      <button type="submit"
        class = "py-1 mt-4 border-2 rounded border-black-200 
        focus:outline-none
        focus:ring-2 focus:ring-blue-500 
        hover:ring-2 hover:ring-yellow-500">
        Login
      </button>

    </form>

  </div>

</div>
